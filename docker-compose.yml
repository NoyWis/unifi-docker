services:
  unifi-db:
    image: mongo:7.0
    container_name: unifi-db
    restart: unless-stopped
    volumes:
      - ./db:/data/db:Z
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-unifi}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS:?set MONGO_PASS in .env}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-network-application
    restart: unless-stopped
    depends_on:
      unifi-db:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - MONGO_USER=${MONGO_USER:-unifi}
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
      - MEM_LIMIT=1024
    volumes:
      - ./config:/config:Z
    ports:
      - "8443:8443"        # web UI
      - "8080:8080"        # device inform
      - "3478:3478/udp"    # STUN
      - "10001:10001/udp"  # AP discovery
      - "1900:1900/udp"    # L2 discovery
      - "6789:6789"        # mobile speed test
      - "8843:8843"        # guest portal HTTPS
      - "8880:8880"        # guest portal HTTP
